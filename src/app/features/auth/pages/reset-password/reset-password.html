<div class="auth-form">
  <h1 class="auth-form__title">Reset password</h1>
  <p class="auth-form__subtitle">Choose a new password for your account.</p>

  @if (successMessage(); as message) {
    <div class="auth-form__success" role="status">{{ message }}</div>
    <p class="auth-form__footer-link">
      <a [routerLink]="loginUrl">Sign in with your new password</a>
    </p>
  } @else {
    @if (errorMessage(); as error) {
      <div class="auth-form__alert" role="alert">{{ error }}</div>
    }

    <form class="auth-form__fields" [formGroup]="form" (ngSubmit)="submit()">
      <app-input
        formControlName="password"
        [label]="'New password'"
        [type]="'password'"
        [required]="true"
        [autocomplete]="'new-password'"
        [hint]="'At least 8 characters.'"
        [error]="passwordError()"
      />

      <app-input
        formControlName="confirmPassword"
        [label]="'Confirm new password'"
        [type]="'password'"
        [required]="true"
        [autocomplete]="'new-password'"
        [error]="confirmError()"
      />

      <div class="auth-form__actions">
        <button appButton [fullWidth]="true" [loading]="loading()" type="submit">
          Reset password
        </button>
      </div>
    </form>

    <p class="auth-form__footer-link">
      <a [routerLink]="loginUrl">Back to sign in</a>
    </p>
  }
</div>

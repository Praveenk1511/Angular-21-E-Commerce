<div class="auth-form">
  <h1 class="auth-form__title">Create account</h1>
  <p class="auth-form__subtitle">Join to track orders, save favourites and checkout faster.</p>

  @if (auth.authError(); as errorMessage) {
    <div class="auth-form__alert" role="alert">{{ errorMessage }}</div>
  }

  <form class="auth-form__fields" [formGroup]="form" (ngSubmit)="submit()">
    <app-input
      formControlName="firstName"
      [label]="'First name'"
      [required]="true"
      [autocomplete]="'given-name'"
      [error]="fieldError('firstName')"
    />

    <app-input
      formControlName="lastName"
      [label]="'Last name'"
      [required]="true"
      [autocomplete]="'family-name'"
      [error]="fieldError('lastName')"
    />

    <app-input
      formControlName="email"
      [label]="'Email address'"
      [type]="'email'"
      [required]="true"
      [autocomplete]="'email'"
      [error]="fieldError('email')"
    />

    <app-input
      formControlName="password"
      [label]="'Password'"
      [type]="'password'"
      [required]="true"
      [autocomplete]="'new-password'"
      [hint]="'At least 8 characters.'"
      [error]="fieldError('password')"
    />

    <app-input
      formControlName="confirmPassword"
      [label]="'Confirm password'"
      [type]="'password'"
      [required]="true"
      [autocomplete]="'new-password'"
      [error]="confirmError()"
    />

    <app-checkbox
      formControlName="marketingOptIn"
      [label]="'Email me about new products and offers'"
    />

    <div class="auth-form__actions">
      <button appButton [fullWidth]="true" [loading]="auth.isLoading()" type="submit">
        Create account
      </button>
    </div>
  </form>

  <p class="auth-form__footer-link">
    Already have an account? <a [routerLink]="loginUrl">Sign in</a>
  </p>
</div>

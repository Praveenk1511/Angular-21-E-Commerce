<div
  class="admin-layout"
  [class.admin-layout--collapsed]="adminStore.sidebarCollapsed()"
>
  <!-- ADMIN SIDEBAR -->
  <aside class="admin-sidebar" aria-label="Admin Navigation">
    <div class="admin-sidebar__brand">
      <div class="admin-sidebar__logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Lumen Admin</span>
      </div>

      <button
        type="button"
        class="admin-sidebar__toggle-btn"
        (click)="adminStore.toggleSidebar()"
        aria-label="Toggle sidebar"
      >
        <app-icon name="chevron-left" [size]="16" />
      </button>
    </div>

    <nav class="admin-sidebar__nav">
      <ul class="admin-sidebar__list" role="list">
        @for (item of navItems; track item.id) {
          <li class="admin-sidebar__item">
            <a
              [routerLink]="item.url"
              routerLinkActive="admin-sidebar__link--active"
              class="admin-sidebar__link"
            >
              <app-icon [name]="item.icon" [size]="18" />
              <span class="admin-sidebar__label">{{ item.label }}</span>
              @if (item.badge) {
                <span class="admin-sidebar__badge">{{ item.badge }}</span>
              }
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="admin-sidebar__footer">
      <a [routerLink]="storefrontUrl" class="admin-sidebar__exit-btn">
        <app-icon name="chevron-left" [size]="16" />
        <span>Return to Store</span>
      </a>
    </div>
  </aside>

  <!-- MAIN ADMIN BODY -->
  <div class="admin-main">
    <!-- ADMIN HEADER -->
    <header class="admin-header">
      <div class="admin-header__left">
        <button
          type="button"
          class="admin-header__menu-btn"
          (click)="adminStore.toggleSidebar()"
          aria-label="Open sidebar"
        >
          <app-icon name="menu" [size]="20" />
        </button>

        <div class="admin-header__search">
          <app-icon name="search" [size]="16" class="admin-header__search-icon" />
          <input
            type="search"
            placeholder="Search orders, products, customers..."
            class="admin-header__search-input"
          />
        </div>
      </div>

      <div class="admin-header__right">
        <a [routerLink]="storefrontUrl" class="admin-header__store-link">
          <app-icon name="cart" [size]="16" />
          <span>Live Storefront</span>
        </a>

        <div class="admin-header__user-profile">
          <div class="admin-header__avatar">A</div>
          <div class="admin-header__user-info">
            <span class="admin-header__user-name">Alex Morgan</span>
            <span class="admin-header__user-role">Administrator</span>
          </div>
        </div>
      </div>
    </header>

    <!-- ADMIN CONTENT OUTLET -->
    <main class="admin-content">
      <router-outlet />
    </main>
  </div>
</div>

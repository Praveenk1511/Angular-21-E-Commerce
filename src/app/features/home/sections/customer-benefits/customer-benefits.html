<section class="benefits" aria-label="Customer benefits">
  <div class="benefits__grid">
    @for (benefit of benefits; track benefit.title) {
      <div class="benefits__item">
        <span class="benefits__icon" aria-hidden="true">
          <app-icon [name]="benefit.icon" [size]="24" />
        </span>
        <h3 class="benefits__title">{{ benefit.title }}</h3>
        <p class="benefits__description">{{ benefit.description }}</p>
      </div>
    }
  </div>
</section>

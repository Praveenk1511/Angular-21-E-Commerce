<header class="site-header">
  <div class="site-header__bar container">
    <button
      #menuToggle
      class="site-header__menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-controls]="menuId"
      (click)="toggleMenu()"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="22" />
      <span class="visually-hidden">{{ menuOpen() ? 'Close main menu' : 'Open main menu' }}</span>
    </button>

    <app-site-logo class="site-header__logo" />

    <app-site-search class="site-header__search" />

    <ul class="site-header__actions" role="list">
      <!-- Account action: reactive to auth state -->
      <li>
        @if (auth.isAuthenticated()) {
          <a
            class="site-header__action site-header__action--labelled"
            [routerLink]="profileUrl"
            routerLinkActive="site-header__action--active"
            ariaCurrentWhenActive="page"
          >
            <app-icon name="user" [size]="21" />
            <span class="site-header__action-label">{{ auth.displayName() }}</span>
          </a>
        } @else if (loginAction) {
          <a
            class="site-header__action site-header__action--labelled"
            [routerLink]="loginAction.url"
            routerLinkActive="site-header__action--active"
            ariaCurrentWhenActive="page"
          >
            <app-icon [name]="loginAction.icon" [size]="21" />
            <span class="site-header__action-label">{{ loginAction.label }}</span>
          </a>
        }
      </li>

      @for (action of utilityActions; track action.id) {
        <li>
          <a
            class="site-header__action"
            [class.site-header__action--labelled]="action.showLabelOnDesktop"
            [routerLink]="action.url"
            routerLinkActive="site-header__action--active"
            ariaCurrentWhenActive="page"
          >
            <app-icon [name]="action.icon" [size]="21" />
            <span class="site-header__action-label">{{ action.label }}</span>
          </a>
        </li>
      }

      <!-- Logout: shown only when signed in -->
      @if (auth.isAuthenticated()) {
        <li>
          <button class="site-header__action" type="button" (click)="logout()">
            <app-icon name="close" [size]="18" />
            <span class="site-header__action-label">Sign out</span>
          </button>
        </li>
      }
    </ul>
  </div>

  <div class="site-header__menu" [class.site-header__menu--open]="menuOpen()" [id]="menuId">
    <div class="site-header__menu-inner container">
      <app-main-navigation [items]="navigationItems" />
    </div>
  </div>
</header>

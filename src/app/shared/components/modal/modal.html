<dialog
  appDialogHost
  [class]="dialogClasses()"
  [open]="open()"
  [closeOnBackdrop]="closeOnBackdrop() && dismissible()"
  [attr.aria-labelledby]="headingId"
  (dialogClose)="close()"
>
  <div class="modal__panel">
    <header class="modal__header">
      <h2 class="modal__heading" [id]="headingId">{{ heading() }}</h2>

      @if (dismissible()) {
        <button appIconButton [label]="'Close dialog'" [variant]="'plain'" (click)="close()">
          <app-icon name="close" [size]="20" />
        </button>
      }
    </header>

    <div class="modal__body">
      <ng-content />
    </div>

    <footer class="modal__footer">
      <ng-content select="[modalFooter]" />
    </footer>
  </div>
</dialog>

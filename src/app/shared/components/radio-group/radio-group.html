<fieldset
  class="radio-group"
  [disabled]="isDisabled()"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="error() ? 'true' : null"
  [attr.aria-required]="required() ? 'true' : null"
>
  <legend class="radio-group__legend">
    {{ label() }}
    @if (required()) {
      <span class="radio-group__required" aria-hidden="true">*</span>
    }
  </legend>

  <div
    class="radio-group__options"
    [class.radio-group__options--inline]="orientation() === 'horizontal'"
  >
    @for (option of options(); track option.value) {
      <div class="radio-group__option">
        <span class="radio-group__control">
          <input
            class="radio-group__native"
            type="radio"
            [id]="optionId(option.value)"
            [name]="groupName"
            [value]="option.value"
            [checked]="isSelected(option.value)"
            [disabled]="option.disabled ?? false"
            (change)="onSelect(option.value)"
            (blur)="markTouched()"
          />
          <span class="radio-group__dot" aria-hidden="true"></span>
        </span>

        <label class="radio-group__label" [attr.for]="optionId(option.value)">
          {{ option.label }}
        </label>
      </div>
    }
  </div>

  @if (error()) {
    <p class="radio-group__error" [id]="errorId">{{ error() }}</p>
  } @else if (hint()) {
    <p class="radio-group__hint" [id]="hintId">{{ hint() }}</p>
  }
</fieldset>

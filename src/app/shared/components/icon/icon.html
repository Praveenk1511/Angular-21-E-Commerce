<svg
  class="icon"
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  @switch (name()) {
    @case ('search') {
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.6-3.6" />
    }
    @case ('user') {
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
    }
    @case ('heart') {
      <path d="M12 20.4 4.7 13a4.8 4.8 0 0 1 6.8-6.8l.5.5.5-.5A4.8 4.8 0 0 1 19.3 13Z" />
    }
    @case ('cart') {
      <path d="M2.5 4h2.2l2.4 11.2a2 2 0 0 0 2 1.6h8a2 2 0 0 0 2-1.6L20.8 8H6" />
      <circle cx="10" cy="20" r="1.4" />
      <circle cx="17.5" cy="20" r="1.4" />
    }
    @case ('menu') {
      <path d="M4 7h16M4 12h16M4 17h16" />
    }
    @case ('close') {
      <path d="M6 6l12 12M18 6 6 18" />
    }
    @case ('chevron-left') {
      <path d="m14.5 6-6 6 6 6" />
    }
    @case ('chevron-right') {
      <path d="m9.5 6 6 6-6 6" />
    }
    @case ('chevron-down') {
      <path d="m6 9.5 6 6 6-6" />
    }
    @case ('check') {
      <path d="m5 12.5 4.5 4.5L19 7" />
    }
    @case ('minus') {
      <path d="M5 12h14" />
    }
    @case ('plus') {
      <path d="M12 5v14M5 12h14" />
    }
    @case ('star') {
      <path d="m12 3.6 2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.75L6.8 19.65l1-5.8-4.2-4.1 5.8-.85Z" />
    }
    @case ('alert-triangle') {
      <path d="M12 4.5 21 20H3Z" />
      <path d="M12 10v4.5" />
      <path d="M12 17.4h.01" />
    }
    @case ('info') {
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 11v5.5" />
      <path d="M12 7.8h.01" />
    }
    @case ('check-circle') {
      <circle cx="12" cy="12" r="8.5" />
      <path d="m8.2 12.3 2.6 2.6 5-5.2" />
    }
    @case ('inbox') {
      <path d="M3.5 13h4l1.3 2.4h6.4L16.5 13h4" />
      <path d="M3.5 13 6 5.5h12L20.5 13v5a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18Z" />
    }
  }
</svg>

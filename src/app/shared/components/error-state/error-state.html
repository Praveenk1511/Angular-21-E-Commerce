<div class="error-state" role="status" aria-live="polite">
  <span class="error-state__icon" aria-hidden="true">
    <app-icon name="alert-triangle" [size]="28" />
  </span>

  <p class="error-state__heading">{{ heading() }}</p>

  @if (message()) {
    <p class="error-state__message">{{ message() }}</p>
  }

  @if (showRetry()) {
    <button appButton [variant]="'secondary'" type="button" (click)="retry.emit()">
      {{ retryLabel() }}
    </button>
  }
</div>

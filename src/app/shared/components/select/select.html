<app-form-field
  [label]="label()"
  [controlId]="controlId"
  [hint]="hint()"
  [hintId]="hintId"
  [error]="error()"
  [errorId]="errorId"
  [required]="required()"
  [labelHidden]="labelHidden()"
>
  <div class="select__shell">
    <select
      class="select__control"
      [id]="controlId"
      [value]="value() ?? ''"
      [disabled]="isDisabled()"
      [required]="required()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (change)="onChange($event)"
      (blur)="markTouched()"
    >
      @if (placeholder()) {
        <option value="" disabled>{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled ?? false">
          {{ option.label }}
        </option>
      }
    </select>

    <span class="select__chevron" aria-hidden="true">
      <app-icon name="chevron-down" [size]="18" />
    </span>
  </div>
</app-form-field>
